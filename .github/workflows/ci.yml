name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: sunrise_dental
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Wait for MySQL and load schema
        env:
          MYSQL_PWD: ""
        run: |
          for i in $(seq 1 20); do
            mysqladmin ping -h 127.0.0.1 -u root --silent && break
            sleep 3
          done
          mysql -h 127.0.0.1 -u root < database/schema.sql

      - name: Build (compile)
        run: mvn -B compile

      - name: Run test suite
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sunrise_dental
          DB_USER: root
          DB_PASSWORD: ""
        run: mvn -B test

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Package WAR
        if: success()
        run: mvn -B package -DskipTests
