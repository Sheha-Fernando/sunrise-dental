<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Sunrise Dental</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="appShell"></div>

<template id="pageTemplate">
    <div class="page-header">
        <div>
            <h1>My profile</h1>
            <p class="page-subtitle">Your account information.</p>
        </div>
        <div class="page-header-actions">
            <button type="button" class="btn btn-secondary" id="openEditProfileBtn" hidden>
                <svg class="btn-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                    <path d="M13.5 3.5l3 3L6 17H3v-3L13.5 3.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                </svg>
                Edit profile
            </button>
        </div>
    </div>

    <div id="profileAlert" class="alert alert-error" role="alert"></div>

    <div class="card" style="max-width:640px;">
        <div class="loading-inline" id="profileLoading"><span class="spinner"></span> Loading profile...</div>

        <div id="profileContent" hidden>
            <div class="profile-identity">
                <div class="profile-avatar" id="profileAvatar"></div>
                <div>
                    <div class="profile-name" id="profileFullName"></div>
                    <div class="profile-role" id="profileRole"></div>
                </div>
            </div>

            <div class="detail-grid">
                <div class="detail-item">
                    <div class="detail-label">
                        <svg class="detail-label-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="6.5" r="3.25" stroke="currentColor" stroke-width="1.4"/><path d="M3.5 17c0-3.4 2.9-6 6.5-6s6.5 2.6 6.5 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                        Username
                    </div>
                    <div class="detail-value" id="profileUsername"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">
                        <svg class="detail-label-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 3.5h2.3l1 3.4-1.7 1.3a9 9 0 0 0 4.2 4.2l1.3-1.7 3.4 1v2.3c0 .8-.7 1.4-1.5 1.3C8.9 14.9 5.1 11.1 4.7 6.5c-.1-.8.5-1.5 1.3-1.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
                        Contact
                    </div>
                    <div class="detail-value" id="profileContact"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">
                        <svg class="detail-label-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="3" y="4.5" width="14" height="11" rx="1.2" stroke="currentColor" stroke-width="1.4"/><path d="M3.5 5.5l6.5 5 6.5-5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        Email
                    </div>
                    <div class="detail-value" id="profileEmail"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">
                        <svg class="detail-label-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="6.5" stroke="currentColor" stroke-width="1.4"/><path d="M10 6.5V10l2.5 1.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                        Last Login
                    </div>
                    <div class="detail-value" id="profileLastLogin"></div>
                </div>
            </div>

            <div class="profile-section" id="profileRoleSection" hidden></div>

            <div class="profile-section">
                <button type="button" class="btn btn-secondary" id="openChangePasswordBtn">
                    <svg class="btn-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                        <rect x="4.5" y="9" width="11" height="8" rx="1.3" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M6.5 9V6.5a3.5 3.5 0 0 1 7 0V9" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                    Change password
                </button>
            </div>
        </div>
    </div>
</template>

<div class="modal-overlay" id="editProfileModalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editProfileModalTitle">
        <button type="button" class="modal-close" id="closeEditProfileModal" aria-label="Close">&times;</button>
        <h2 id="editProfileModalTitle">Edit Profile</h2>
        <div id="editProfileAlert" class="alert alert-error" role="alert"></div>
        <form id="editProfileForm" novalidate>
            <div class="form-group">
                <label for="editFullName">Full Name <span aria-hidden="true">*</span></label>
                <input type="text" id="editFullName" required>
                <p class="field-error" id="editFullNameError">Full name is required.</p>
            </div>
            <div class="form-group">
                <label for="editUsername">Username <span aria-hidden="true">*</span></label>
                <input type="text" id="editUsername" required>
                <p class="field-error" id="editUsernameError">Username is required.</p>
            </div>
            <div class="form-group">
                <label for="editContact">Contact Number</label>
                <input type="tel" id="editContact" placeholder="e.g. 0771234567">
                <p class="field-error" id="editContactError">Please enter a valid contact number.</p>
            </div>
            <div class="form-group">
                <label for="editEmail">Email Address</label>
                <input type="email" id="editEmail" placeholder="e.g. name@sunrisedental.lk">
                <p class="field-error" id="editEmailError">Please enter a valid email address.</p>
            </div>
            <div class="btn-row">
                <button type="button" class="btn btn-secondary" id="cancelEditProfileBtn">Cancel</button>
                <button type="submit" class="btn btn-primary" id="editProfileSubmitBtn">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<div class="modal-overlay" id="changePasswordModalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="changePasswordModalTitle">
        <button type="button" class="modal-close" id="closeChangePasswordModal" aria-label="Close">&times;</button>
        <h2 id="changePasswordModalTitle">Change Password</h2>
        <div id="changePasswordAlert" class="alert alert-error" role="alert"></div>
        <form id="changePasswordForm" novalidate>
            <div class="form-group">
                <label for="currentPassword">Current Password <span aria-hidden="true">*</span></label>
                <input type="password" id="currentPassword" required>
                <p class="field-error" id="currentPasswordError">Current password is required.</p>
            </div>
            <div class="form-group">
                <label for="newPassword">New Password <span aria-hidden="true">*</span></label>
                <input type="password" id="newPassword" required>
                <p class="field-error" id="newPasswordError">New password must be at least 6 characters.</p>
            </div>
            <div class="form-group">
                <label for="confirmNewPassword">Confirm New Password <span aria-hidden="true">*</span></label>
                <input type="password" id="confirmNewPassword" required>
                <p class="field-error" id="confirmNewPasswordError">Passwords do not match.</p>
            </div>
            <div class="btn-row">
                <button type="button" class="btn btn-secondary" id="cancelChangePasswordBtn">Cancel</button>
                <button type="submit" class="btn btn-primary" id="changePasswordSubmitBtn">Change Password</button>
            </div>
        </form>
    </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/format.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/profile.js"></script>
</body>
</html>
