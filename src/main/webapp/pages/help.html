<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help &amp; User Guide - Sunrise Dental</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="appShell"></div>

<template id="pageTemplate">
    <div class="page-header">
        <div>
            <h1>Help &amp; User Guide</h1>
            <p class="page-subtitle">Step-by-step instructions for clinic staff.</p>
        </div>
    </div>

    <div class="card">
        <section class="help-section">
            <h3>Getting Started</h3>
            <ol>
                <li>Enter your username and password on the sign-in page.</li>
                <li>Click Sign In.</li>
                <li>Use the sidebar to move between Dashboard, Appointments, Patients, Billing and Help.</li>
            </ol>
        </section>

        <section class="help-section">
            <h3>Registering a Patient</h3>
            <ol>
                <li>Open Patients from the sidebar.</li>
                <li>Search first - the patient may already be registered.</li>
                <li>If they're new, click + Register Patient.</li>
                <li>Enter the patient's full name, address and contact number.</li>
                <li>Click Register Patient.</li>
            </ol>
        </section>

        <section class="help-section">
            <h3>Editing Patient Information</h3>
            <p>Available to Administrators and Receptionists only.</p>
            <ol>
                <li>Open the patient's profile from Patients.</li>
                <li>Click Edit Patient.</li>
                <li>Update the name, address or contact number.</li>
                <li>Click Save Changes.</li>
            </ol>
        </section>

        <section class="help-section">
            <h3>Creating an Appointment</h3>
            <ol>
                <li>Open Appointments and click + New Appointment.</li>
                <li>Choose New Patient, or search for an Existing Patient by name or contact number.</li>
                <li>Select a dentist, treatment and date.</li>
                <li>The available-times grid appears automatically - grey/struck-through times are already
                    booked for that dentist. Click any open time to select it.</li>
                <li>Click Register Appointment.</li>
            </ol>
        </section>

        <section class="help-section">
            <h3>How Are Appointment Numbers Generated?</h3>
            <p>
                Automatically, by the system - staff never type or choose one. Each appointment receives
                a number in the form <strong>APT-000123</strong> as soon as it is registered, shown on the
                confirmation screen. You never need to guess the next number.
            </p>
        </section>

        <section class="help-section">
            <h3>Finding an Appointment or Patient</h3>
            <ol>
                <li>Open Appointments to browse, search by patient name or appointment number, and filter
                    by date, dentist or status.</li>
                <li>Open Patients to search by name, contact number or patient ID.</li>
                <li>Click any row to open its full details.</li>
            </ol>
        </section>

        <section class="help-section">
            <h3>Generating a Bill</h3>
            <ol>
                <li>Open Billing.</li>
                <li>Enter the appointment number and click Find Appointment.</li>
                <li>Click Generate Bill.</li>
                <li>Review the treatment cost, consultation fee and total.</li>
                <li>Click Print Receipt.</li>
            </ol>
        </section>

        <section class="help-section">
            <h3>Understanding Appointment Status</h3>
            <p>Every appointment is one of three statuses:</p>
            <ol>
                <li><strong>Scheduled</strong> - booked and upcoming.</li>
                <li><strong>Completed</strong> - the visit has taken place.</li>
                <li><strong>Cancelled</strong> - the appointment will not go ahead; the time slot becomes available again for the same dentist.</li>
            </ol>
        </section>

        <section class="help-section">
            <h3>If a Dentist Is Already Booked</h3>
            <p>
                If the system shows "This dentist is already booked at this date and time", choose a
                different time or a different dentist. This protection cannot be bypassed - it keeps
                the schedule free of double bookings.
            </p>
        </section>

        <section class="help-section">
            <h3>For Dentists</h3>
            <p>
                Your Dashboard and My Schedule only show your own appointments. My Patients lists
                patients from your own appointment history. You will not see another dentist's
                schedule or patients.
            </p>
        </section>

        <section class="help-section">
            <h3>For Clinical Assistants</h3>
            <p>
                Your Dashboard shows your assigned dentist and their schedule. My Schedule and My
                Patients are limited to that dentist's appointments only - you will not see another
                dentist's schedule, patients, or any billing/staff/report information.
            </p>
        </section>

        <section class="help-section">
            <h3>What Can Each Role Access?</h3>
            <div class="table-wrap">
                <table class="data-table">
                    <thead><tr><th>Role</th><th>Can access</th></tr></thead>
                    <tbody>
                        <tr><td class="table-primary-text">Administrator</td><td>Everything - appointments, patients, billing, dentists, treatments, staff, reports</td></tr>
                        <tr><td class="table-primary-text">Receptionist</td><td>Appointments, patients (including registration and editing), billing</td></tr>
                        <tr><td class="table-primary-text">Dentist</td><td>Their own appointments and patients only</td></tr>
                        <tr><td class="table-primary-text">Clinical Assistant</td><td>Their assigned dentist's appointments and patients only</td></tr>
                        <tr><td class="table-primary-text">Billing Staff</td><td>Appointments, patients (view only), billing, reports</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="help-section">
            <h3>Signing Out</h3>
            <p>Click your name in the top-right corner and choose Logout, or use Logout at the bottom of the sidebar.</p>
        </section>
    </div>
</template>

<script src="../js/api.js"></script>
<script src="../js/shell.js"></script>
<script>
    document.addEventListener("shell:ready", () => {
        document.getElementById("pageContent").appendChild(document.getElementById("pageTemplate").content.cloneNode(true));
    });
</script>
</body>
</html>
