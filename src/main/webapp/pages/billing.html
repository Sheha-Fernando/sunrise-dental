<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing - Sunrise Dental</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/print.css">
</head>
<body>

<script>window.PAGE_ROLES = ["ADMIN", "RECEPTIONIST", "BILLING"];</script>
<div id="appShell"></div>

<template id="pageTemplate">
    <div class="page-header no-print">
        <div>
            <h1>Billing</h1>
            <p class="page-subtitle">Generate and print a patient bill.</p>
        </div>
    </div>

    <div class="card no-print" id="statCardsCard" style="margin-bottom:1.25rem;">
        <div id="statCards" class="status-summary-row compact"></div>
    </div>

    <div class="card no-print" id="lookupCard">
        <h2 class="section-title">Find Appointment</h2>
        <form id="lookupForm" novalidate>
            <div class="form-group">
                <label for="appointmentNumber">Appointment Number</label>
                <div class="inline-search-row">
                    <input type="text" id="appointmentNumber" name="appointmentNumber" placeholder="e.g. APT-0234" required>
                    <button type="submit" class="btn btn-primary" id="lookupButton">
                        <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                            <circle cx="9" cy="9" r="6.5"></circle>
                            <line x1="18" y1="18" x2="13.7" y2="13.7"></line>
                        </svg>
                        Find Appointment
                    </button>
                </div>
                <p class="field-error" id="appointmentNumberError">Appointment number is required.</p>
            </div>
        </form>
    </div>

    <div id="billingAlert" class="alert alert-error no-print" role="alert"></div>

    <div id="appointmentSummary" class="card no-print" style="display:none;">
        <div class="schedule-row static">
            <div class="schedule-main">
                <div class="schedule-patient" id="summaryPatientLine"></div>
                <div class="schedule-meta" id="summaryMetaLine"></div>
            </div>
            <div id="summaryRight"></div>
        </div>
        <div class="btn-row" style="margin-top:1rem;">
            <button type="button" class="btn btn-primary" id="generateBillBtn">Generate Bill</button>
            <button type="button" class="btn btn-primary" id="printBillBtn" style="display:none;">Print Bill</button>
        </div>
    </div>

    <div id="receiptCard" class="card print-only">
        <div class="receipt">
            <div class="receipt-header">
                <div class="clinic-name">SUNRISE DENTAL CLINIC</div>
                <div class="clinic-location">Colombo, Sri Lanka</div>
                <div style="margin-top:0.5rem;">Receipt</div>
            </div>

            <div class="receipt-line"><span>Appointment No.</span><strong id="billNumber"></strong></div>
            <div class="receipt-line"><span>Patient</span><strong id="billPatient"></strong></div>
            <div class="receipt-line"><span>Dentist</span><strong id="billDentist"></strong></div>
            <div class="receipt-line"><span>Treatment</span><strong id="billTreatment"></strong></div>
            <div class="receipt-line"><span>Bill Date</span><strong id="billDate"></strong></div>

            <hr class="receipt-divider">

            <div class="receipt-line"><span>Treatment Cost</span><span id="billTreatmentCost"></span></div>
            <div class="receipt-line"><span>Consultation Fee</span><span id="billConsultation"></span></div>

            <hr class="receipt-divider">

            <div class="receipt-total"><span>TOTAL</span><span id="billTotal"></span></div>

            <div class="receipt-footer">Thank you for choosing Sunrise Dental Clinic.</div>
        </div>
    </div>

    <div class="card no-print" id="recentBillsCard" style="margin-top:1.25rem;">
        <div class="section-title-row">
            <h2 class="section-title">Recent Bills</h2>
            <div class="section-title-search">
                <svg class="toolbar-search-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                    <circle cx="9" cy="9" r="6.25" stroke="currentColor" stroke-width="1.6"/>
                    <line x1="13.6" y1="13.6" x2="17.5" y2="17.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
                <input type="search" id="billSearch" placeholder="Search by patient name or appointment number...">
            </div>
        </div>
        <div id="recentBillsContainer"><div class="loading-inline"><span class="spinner"></span> Loading...</div></div>
    </div>
</template>

<script src="../js/api.js"></script>
<script src="../js/format.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/metrics.js"></script>
<script src="../js/billing.js"></script>
</body>
</html>
