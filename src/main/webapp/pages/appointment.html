<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Appointment - Sunrise Dental</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<script>window.PAGE_ROLES = ["ADMIN", "RECEPTIONIST"];</script>
<div id="appShell"></div>

<template id="pageTemplate">
    <div class="page-header">
        <div>
            <a class="back-link" href="appointments.html">&larr; Back to Appointments</a>
            <h1>New Appointment</h1>
            <p class="page-subtitle">Register a new patient visit.</p>
        </div>
    </div>

    <div id="formAlert" class="alert alert-error" role="alert"></div>

    <form id="appointmentForm" novalidate>
        <div class="card">
            <h2 class="section-title">Patient</h2>

            <div class="segmented" style="margin-bottom:1.1rem;">
                <button type="button" class="active" id="newPatientTab">New Patient</button>
                <button type="button" id="existingPatientTab">Existing Patient</button>
            </div>

            <div id="newPatientFields">
                <div class="form-group">
                    <label for="patientName">Patient Name <span aria-hidden="true">*</span></label>
                    <input type="text" id="patientName" name="patientName">
                    <p class="field-error" id="patientNameError">Patient name is required.</p>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="contactNumber">Contact Number <span aria-hidden="true">*</span></label>
                        <input type="tel" id="contactNumber" name="contactNumber">
                        <p class="field-error" id="contactNumberError">Contact number is required.</p>
                    </div>
                    <div class="form-group">
                        <label for="address">Address <span aria-hidden="true">*</span></label>
                        <input type="text" id="address" name="address">
                        <p class="field-error" id="addressError">Address is required.</p>
                    </div>
                </div>
            </div>

            <div id="existingPatientFields" style="display:none;">
                <div class="form-group">
                    <label for="patientSearch">Search existing patient</label>
                    <input type="search" id="patientSearch" placeholder="Search by name or contact number...">
                    <p class="field-error" id="patientIdError">Please select a patient.</p>
                </div>
                <div id="patientSearchResults"></div>
                <div id="selectedPatientSummary" style="display:none;" class="alert alert-info visible"></div>
            </div>
        </div>

        <div class="card">
            <h2 class="section-title">Appointment Details</h2>
            <p class="field-hint" style="margin-top:-0.5rem; margin-bottom:1.1rem;">
                The appointment number is assigned automatically once this appointment is registered.
            </p>

            <div class="form-row">
                <div class="form-group">
                    <label for="dentistId">Dentist <span aria-hidden="true">*</span></label>
                    <select id="dentistId" name="dentistId" required>
                        <option value="">Loading dentists...</option>
                    </select>
                    <p class="field-error" id="dentistIdError">Please select a dentist.</p>
                </div>
                <div class="form-group">
                    <label for="treatmentId">Treatment <span aria-hidden="true">*</span></label>
                    <select id="treatmentId" name="treatmentId" required>
                        <option value="">Loading treatments...</option>
                    </select>
                    <p class="field-error" id="treatmentIdError">Please select a treatment.</p>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="appointmentDate">Date <span aria-hidden="true">*</span></label>
                    <input type="date" id="appointmentDate" name="appointmentDate" required>
                    <p class="field-error" id="appointmentDateError">Please select an appointment date.</p>
                </div>
                <div class="form-group">
                    <label for="appointmentTime">Time <span aria-hidden="true">*</span></label>
                    <input type="time" id="appointmentTime" name="appointmentTime" required>
                    <p class="field-error" id="appointmentTimeError">Please select an appointment time.</p>
                </div>
            </div>

            <div class="form-group" id="availabilityGroup" style="display:none;">
                <label>Available Times for This Dentist</label>
                <div id="availabilityGrid" class="availability-grid"></div>
                <p class="field-hint">Select a dentist and date to see which times are already booked.</p>
            </div>
        </div>

        <div class="btn-row">
            <a href="appointments.html" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary" id="submitButton">Register Appointment</button>
        </div>
    </form>

    <div id="successPanel" class="card" style="display:none;">
        <h2>&#10003; Appointment Registered Successfully</h2>
        <div class="detail-grid" style="margin-top:1rem;">
            <div class="detail-item">
                <div class="detail-label">Appointment Number</div>
                <div class="detail-value" id="resultNumber"></div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Patient</div>
                <div class="detail-value" id="resultPatient"></div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Dentist</div>
                <div class="detail-value" id="resultDentist"></div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Date</div>
                <div class="detail-value" id="resultDate"></div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Time</div>
                <div class="detail-value" id="resultTime"></div>
            </div>
        </div>
        <div class="btn-row">
            <button type="button" class="btn btn-secondary" id="registerAnotherBtn">Book Another Appointment</button>
            <button type="button" class="btn btn-secondary" id="viewPatientBtn">View Patient</button>
            <button type="button" class="btn btn-primary" id="viewAppointmentBtn">View Appointment</button>
        </div>
    </div>
</template>

<script src="../js/api.js"></script>
<script src="../js/format.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/appointment.js"></script>
</body>
</html>
