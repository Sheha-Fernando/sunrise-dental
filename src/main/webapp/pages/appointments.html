<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments - Sunrise Dental</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="appShell"></div>

<template id="pageTemplate">
    <div class="page-header">
        <div>
            <h1 id="pageTitle">Appointments</h1>
            <p class="page-subtitle">Manage today's appointments and clinic activity.</p>
        </div>
        <div class="page-header-actions" id="headerActions"></div>
    </div>

    <div class="toolbar">
        <div class="toolbar-search">
            <svg class="toolbar-search-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <circle cx="9" cy="9" r="6.25" stroke="currentColor" stroke-width="1.6"/>
                <line x1="13.6" y1="13.6" x2="17.5" y2="17.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <input type="search" id="filterSearch" placeholder="Search by patient name or appointment number...">
        </div>
        <input type="date" id="filterDate">
        <select id="filterDentist" style="display:none;">
            <option value="">All dentists</option>
        </select>
        <select id="filterStatus">
            <option value="">All statuses</option>
            <option value="SCHEDULED">Scheduled</option>
            <option value="CHECKED_IN">Checked In</option>
            <option value="COMPLETED">Completed</option>
            <option value="CANCELLED">Cancelled</option>
        </select>
        <button type="button" class="btn btn-secondary btn-sm" id="clearFiltersBtn">Clear</button>
    </div>

    <div id="listContainer"><div class="loading-inline"><span class="spinner"></span> Loading appointments...</div></div>
</template>

<script src="../js/api.js"></script>
<script src="../js/format.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/appointment-actions.js"></script>
<script src="../js/appointments.js"></script>
</body>
</html>
