<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Details - Sunrise Dental</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="appShell"></div>

<template id="pageTemplate">
    <div class="page-header">
        <div>
            <a class="back-link" href="appointments.html">&larr; Back to Appointments</a>
            <h1>Appointment Details</h1>
            <p class="page-subtitle">Search by appointment number.</p>
        </div>
    </div>

    <div class="card" id="lookupCard">
        <form id="searchForm" novalidate>
            <div class="form-group">
                <label for="appointmentNumber">Appointment Number</label>
                <input type="text" id="appointmentNumber" name="appointmentNumber" required>
                <p class="field-error" id="appointmentNumberError">Appointment number is required.</p>
            </div>
            <button type="submit" class="btn btn-primary" id="searchButton">Search</button>
        </form>
    </div>

    <div id="searchAlert" class="alert alert-error" role="alert" style="margin-top:1rem;"></div>

    <div id="resultCard" class="card" style="display:none; margin-top:1rem;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <h2 class="section-title" style="border:none; padding:0; margin:0;">
                Appointment # <span id="resultNumber"></span>
            </h2>
            <span id="resultStatus"></span>
        </div>

        <div class="detail-grid" style="margin-top:1.25rem;">
            <div class="detail-item">
                <div class="detail-label">Patient</div>
                <div class="detail-value" id="resultPatient"></div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Contact Number</div>
                <div class="detail-value" id="resultContact"></div>
            </div>
            <div class="detail-item" style="grid-column: 1 / -1;">
                <div class="detail-label">Address</div>
                <div class="detail-value" id="resultAddress"></div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Dentist</div>
                <div class="detail-value" id="resultDentist"></div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Treatment</div>
                <div class="detail-value" id="resultTreatment"></div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Date</div>
                <div class="detail-value" id="resultDate"></div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Time</div>
                <div class="detail-value" id="resultTime"></div>
            </div>
        </div>

        <div class="btn-row">
            <a href="appointments.html" class="btn btn-secondary">Back to Appointments</a>
            <button type="button" class="btn btn-primary" id="generateBillBtn" style="display:none;">Generate Bill</button>
        </div>
    </div>
</template>

<script src="../js/api.js"></script>
<script src="../js/format.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/search.js"></script>
</body>
</html>
