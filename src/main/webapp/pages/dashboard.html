<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sunrise Dental</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="appShell"></div>

<template id="pageTemplate">
    <div class="page-header">
        <div>
            <h1 id="greeting">Welcome back</h1>
            <p class="page-subtitle" id="dateLine"></p>
        </div>
    </div>

    <div class="card" id="statusSummaryCard" style="margin-bottom:1.25rem; display:none;">
        <h2 class="section-title">Appointment Status Summary</h2>
        <div id="statusSummaryContainer" class="status-summary-row"></div>
    </div>

    <div class="card-row" id="statCards"></div>

    <div class="card" id="clinicOverviewCard" style="margin-top:1.25rem; display:none;">
        <h2 class="section-title">Clinic Overview</h2>
        <div id="clinicOverviewContainer" class="status-summary-row"></div>
    </div>

    <div id="chartsSection" style="display:none;"></div>

    <div class="card" style="margin-top:1rem;">
        <h2 class="section-title" id="scheduleTitle">Today's Schedule</h2>
        <div id="scheduleContainer"><div class="loading-inline"><span class="spinner"></span> Loading schedule...</div></div>
    </div>

    <div class="card" id="secondaryCard" style="margin-top:1rem; display:none;">
        <h2 class="section-title" id="secondaryTitle"></h2>
        <div id="secondaryContainer"></div>
    </div>

    <div class="card" id="activityCard" style="margin-top:1rem; display:none;">
        <h2 class="section-title">Today's Clinic Activity</h2>
        <div id="activityContainer" class="activity-feed"></div>
    </div>

    <div class="card" style="margin-top:1rem;">
        <h2 class="section-title">Quick Actions</h2>
        <div class="card-row" id="quickActions"></div>
    </div>
</template>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="../js/api.js"></script>
<script src="../js/format.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/dashboard.js"></script>
</body>
</html>
