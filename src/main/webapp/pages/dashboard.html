<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sunrise Dental</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="app-header">
    <div class="brand">
        <span class="brand-name">SUNRISE DENTAL</span>
        <span class="brand-tagline">Clinic Management System</span>
    </div>
    <div class="staff-info">
        <span>Staff: <strong id="staffName">...</strong></span>
        <button type="button" class="btn btn-secondary" id="logoutBtn">Logout</button>
    </div>
</header>

<main class="page-container">
    <h1>Welcome back</h1>
    <p>Manage today's appointments and patient visits.</p>

    <nav class="menu-grid" aria-label="Main menu">
        <a class="menu-card" href="appointment.html">
            <span class="menu-icon" aria-hidden="true">📅</span>
            <span class="menu-title">New Appointment</span>
            <span class="menu-desc">Register a patient visit</span>
        </a>
        <a class="menu-card" href="search.html">
            <span class="menu-icon" aria-hidden="true">🔎</span>
            <span class="menu-title">Find Appointment</span>
            <span class="menu-desc">Search by appointment number</span>
        </a>
        <a class="menu-card" href="billing.html">
            <span class="menu-icon" aria-hidden="true">🧾</span>
            <span class="menu-title">Billing</span>
            <span class="menu-desc">Generate and print a bill</span>
        </a>
        <a class="menu-card" href="help.html">
            <span class="menu-icon" aria-hidden="true">❓</span>
            <span class="menu-title">Help</span>
            <span class="menu-desc">Step-by-step instructions</span>
        </a>
    </nav>
</main>

<script src="../js/api.js"></script>
<script src="../js/guard.js"></script>
</body>
</html>
