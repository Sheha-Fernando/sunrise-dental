<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunrise Dental - Sign In</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="login-shell">
    <div class="login-visual" aria-hidden="true"></div>

    <div class="login-form-side">
        <div class="login-card">
            <div class="login-brand">
                <div class="visual-mark">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M12 3c-2 0-3 1.1-4.1 1.1-1.6 0-2.9-1.1-4.6-1.1C2.2 3 1.5 4 1.5 5.6c0 5.6 1.7 14.4 3.9 14.4 1.4 0 1.7-2.9 2.9-2.9h7.4c1.2 0 1.5 2.9 2.9 2.9 2.2 0 3.9-8.8 3.9-14.4 0-1.6-.7-2.6-1.8-2.6-1.7 0-3 1.1-4.6 1.1C15 4.1 14 3 12 3z"
                            stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div>
                    <h1>Sunrise Dental</h1>
                    <div class="login-tagline">Clinic Management System</div>
                </div>
            </div>

            <h2>Welcome back</h2>
            <p class="login-subtitle">Sign in to continue.</p>

            <div id="loginAlert" class="alert alert-error" role="alert"></div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" required>
                    <p class="field-error" id="usernameError">Username is required.</p>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password" autocomplete="current-password" required>
                        <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">Show</button>
                    </div>
                    <p class="field-error" id="passwordError">Password is required.</p>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="loginButton">Sign in</button>
            </form>

            <p class="login-footer-note">Authorized clinic staff only.</p>
            <p class="login-footer-note">
                <button type="button" class="login-footer-link" id="forgotPasswordLink">Forgot your password? Contact your administrator.</button>
            </p>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
